        tailwind.config = {
            theme: {

    <style>
        /* 强制最小宽度为 1920px，保证所有的像素级尺寸绝对不会因为屏幕小而被挤压变形 */
        body {
            min-width: 1920px;
            overflow-x: auto;
            background-color: #F2F5F8; /* 灰色底层背景 */
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* 引入设计稿特殊字体 (需本机安装，否则回退系统粗体) */
        .font-youshe { font-family: 'YouSheBiaoTiHei', 'Microsoft YaHei', sans-serif; }
        .font-pangmen { font-family: 'PangMenZhengDao', 'Impact', sans-serif; }
        .font-pingfang { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        
        /* 淡入动画 */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

                </button>
                <button onclick="switchPage('“举榜挂帅”项目', this)" class="nav-btn w-[420px] h-[80px] bg-[#FCFCFD] shadow-[inset_1px_-1px_20px_0px_#DFE5EF] text-[#344977] rounded-none font-bold tracking-wider flex items-center justify-center text-[22px] hover:text-[#2B6EF5] hover:bg-[#F0F5FF] transition-all">
                    “举榜挂帅”项目
                </button>
                <button onclick="switchPage('课程教材', this)" class="nav-btn w-[420px] h-[80px] bg-[#FCFCFD] shadow-[inset_1px_-1px_20px_0px_#DFE5EF] text-[#344977] rounded-none font-bold tracking-wider flex items-center justify-center text-[22px] hover:text-[#2B6EF5] hover:bg-[#F0F5FF] transition-all">
                    课程教材
                </button>
                <button onclick="switchPage('工作建议', this)" class="nav-btn w-[420px] h-[80px] bg-[#FCFCFD] shadow-[inset_1px_-1px_20px_0px_#DFE5EF] text-[#344977] rounded-none font-bold tracking-wider flex items-center justify-center text-[22px] hover:text-[#2B6EF5] hover:bg-[#F0F5FF] transition-all">
                    工作建议
                </button>
                
            </div>
        </div>

    </div>

    <!-- 交互脚本 -->
    <script>
        let originalContent = '';

        function switchPage(pageName, btnElement) {
            const displayArea = document.getElementById('main-display-area');
            const navBtns = document.querySelectorAll('.nav-btn');
            
            if (!originalContent) {
                originalContent = displayArea.innerHTML;
            }

            navBtns.forEach(btn => {
                btn.classList.remove('text-[#2B6EF5]', 'bg-[#F0F5FF]');
            });
            if (btnElement) {
                btnElement.classList.add('text-[#2B6EF5]', 'bg-[#F0F5FF]');
            }

            displayArea.style.opacity = '0';
            
            setTimeout(() => {
                if (pageName === '对照表总览') {
                    displayArea.innerHTML = originalContent;
                } else {
                    displayArea.innerHTML = `
                        <div class="w-full h-full flex flex-col items-center justify-center fade-in">
                            <h2 class="text-[#344977] font-bold text-[36px] tracking-widest font-pangmen">${pageName}</h2>
                            <p class="text-gray-400 text-[18px] mt-4 tracking-wide">该页面的专属切图和数据组件将在这里渲染</p>
                            
                            <!-- 提供一个返回按钮，方便用户切回主页 -->
                            <button onclick="switchPage('对照表总览', document.querySelectorAll('.nav-btn')[0])" class="mt-12 bg-[#2D70EB] hover:bg-[#255ED4] text-white px-8 py-3 rounded-full text-[16px] font-semibold tracking-wider transition-colors shadow-lg">
                                返回全景图
                            </button>
                        </div>
                    `;
                }
                
                displayArea.style.opacity = '1';
                
            }, 300);
        }

        window.onload = function() {
            const firstBtn = document.querySelectorAll('.nav-btn')[0];
            if(firstBtn) {
                firstBtn.classList.add('text-[#2B6EF5]', 'bg-[#F0F5FF]');
            }
        }
    </script>
</body>
</html>

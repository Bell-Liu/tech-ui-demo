<!DOCTYPE html>

        tailwind.config = {

            min-width: 1920px;
            overflow-x: auto;
            background-color: #F2F5F8; /* 灰色底层背景 */

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* 引入设计稿特殊字体 (需本机安装，否则回退系统粗体) */

        .font-pingfang { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }

        /* 页面切换的淡入淡出动画过渡 */
        .fade-transition {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>

        function switchPage(pageName, btnElement) {
            const displayArea = document.getElementById('main-display-area');
            const allBtns = document.querySelectorAll('.nav-btn');

            // 1. 重置所有按钮状态 (去掉高亮，恢复默认文字颜色和背景)
            allBtns.forEach(btn => {
                btn.classList.remove('text-[#2B6EF5]', 'bg-[#F0F5FF]');
                btn.classList.add('text-[#344977]', 'bg-[#FCFCFD]');
            });

            // 2. 为当前点击的按钮添加高亮状态 (蓝色文字，浅蓝背景)
            if (btnElement) {
                btnElement.classList.remove('text-[#344977]', 'bg-[#FCFCFD]');
                btnElement.classList.add('text-[#2B6EF5]', 'bg-[#F0F5FF]');
            }

            // 3. 执行淡出动画
            displayArea.style.opacity = '0';

            // 等待淡出动画完成后，替换内容并淡入

                if (pageName === '对照表总览') {
                    // 如果点击的是第一个按钮，恢复完整的树状图谱结构
                    displayArea.innerHTML = initialGraphHTML;

        let originalContent = '';

        function switchPage(pageName) {

            displayArea.style.opacity = '0';
            
            setTimeout(() => {
                if (pageName === '对照表总览') {
                    displayArea.innerHTML = originalContent;
                } else {
                    displayArea.innerHTML = `
                        <div class="w-full h-full flex flex-col items-center justify-center fade-in">
                            <h2 class="text-[#344977] font-bold text-[36px] tracking-widest font-pangmen">${pageName}</h2>
                            <p class="text-gray-400 text-[18px] mt-4 tracking-wide">该页面的专属切图和数据组件将在这里渲染</p>
                            <button onclick="switchPage('对照表总览')" class="mt-12 bg-[#2D70EB] hover:bg-[#255ED4] text-white px-8 py-3 rounded-[6px] text-[16px] font-semibold tracking-wider transition-colors shadow-lg">
                                返回全景图
                            </button>
                        </div>
                    `;
                }
                displayArea.style.opacity = '1';
            }, 300);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政治业务对照表</title>
    <!-- 引入 Tailwind CSS 引擎 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 声明优设标题黑，直接调用你 Mac 本地安装好的字体 */
        @font-face {
            font-family: 'YouSheBiaoTiHei';
            src: local('YouSheBiaoTiHei'), local('优设标题黑');
        }
        body {
            /* 整体背景色 */
            background-color: #F5F7FA; 
        }
    </style>
</head>
<body class="font-pingfang text-gray-800 antialiased min-h-screen flex flex-col items-center">

    <!-- 1800px 主容器 -->
    <div class="w-[1800px] flex flex-col pb-[60px] mt-[20px]">

        <!-- ==================== 第一部分：顶部 Header 区域 ==================== -->
        <!-- 这里先用一个占位块替代你最顶部的深蓝色海报，你需要替换为实际的 img 标签 -->
        <div class="w-full h-[140px] bg-blue-600 rounded-t-[8px]"></div>

        <!-- “四级”、“五有”、“七步” 核心理念白底条幅 -->
        <div class="w-full h-[100px] bg-white flex items-center justify-center border-b border-blue-100 shadow-sm rounded-b-[8px]">
            
            <!-- 模块 1：压实四级 -->
            <div class="flex items-center gap-[10px]">
                <!-- 请确认这里的文件名是否与你 assets 文件夹中的一致 -->
                <img src="./assets/assets-icon-压实“四级”主体责任.png" alt="四级" class="w-[42px] h-[42px] object-contain">
                <div class="text-[32px] text-[#2D70EB] font-['YouSheBiaoTiHei']">
                    压实“四级”主体责任
                </div>
            </div>

            <!-- 间距 40px 及分隔线 -->
            <div class="mx-[40px] w-[1px] h-[30px] bg-blue-200"></div>

            <!-- 模块 2：深化五有 -->
            <div class="flex items-center gap-[10px]">
                <!-- 请确认这里的文件名是否与你 assets 文件夹中的一致 -->
                <img src="./assets/assets-icon-优设“五有”运行模式@2x.png" alt="五有" class="w-[42px] h-[42px] object-contain">
                <div class="text-[32px] text-[#2D70EB] font-['YouSheBiaoTiHei']">
                    深化“五有”运行模式
                </div>
            </div>

            <!-- 间距 40px 及分隔线 -->
            <div class="mx-[40px] w-[1px] h-[30px] bg-blue-200"></div>

            <!-- 模块 3：拧紧七步 -->
            <div class="flex items-center gap-[10px]">
                <!-- 请确认这里的文件名是否与你 assets 文件夹中的一致 -->
                <img src="./assets/assets-icon-拧紧“七步”程序链条@2x.png" alt="七步" class="w-[42px] h-[42px] object-contain">
                <div class="text-[32px] text-[#2D70EB] font-['YouSheBiaoTiHei']">
                    拧紧“七步”程序链条
                </div>
            </div>
            
        </div>

        <!-- ==================== 第二部分：中间全景图区域 ==================== -->
        <!-- 暂时用一个白板占位，你可以把切好的“政治业务对照表”大图塞进这里 -->
        <div class="mt-[20px] w-full bg-[#FFFFFF] rounded-[8px] shadow-[2px_4px_20px_0px_rgba(68,73,85,0.12)] p-[30px] min-h-[600px] flex justify-center items-center">
            <p class="text-gray-400 text-lg">这里放置“政治业务对照表”大版块切图</p>
        </div>

        <!-- ==================== 第三部分：底部 8 个按钮矩阵 ==================== -->
        <!-- 这部分是你原封不动写好的优美代码 -->
        <div class="mt-[40px] w-[1800px] bg-[#FFFFFF] rounded-[8px] shadow-[2px_4px_20px_0px_rgba(68,73,85,0.12)] p-[30px]">
            <div class="grid grid-cols-4 gap-x-[20px] gap-y-[25px]">
                <!-- 按钮1 -->
                <button class="w-[420px] h-[80px] bg-[#FCFCFD] shadow-[inset_1px_-1px_20px_0px_#DFE5EF] text-[#344977] text-[20px] rounded-[8px]">
                    对照表总览
                </button>
                <!-- 按钮2 -->
                <button class="w-[420px] h-[80px] bg-[#FCFCFD] shadow-[inset_1px_-1px_20px_0px_#DFE5EF] text-[#344977] text-[20px] rounded-[8px]">
                    知识图谱
                </button>
                <!-- 按钮3 -->
                <button class="w-[420px] h-[80px] bg-[#FCFCFD] shadow-[inset_1px_-1px_20px_0px_#DFE5EF] text-[#344977] text-[20px] rounded-[8px]">
                    能力评价标准
                </button>
                <!-- 按钮4 -->
                <button class="w-[420px] h-[80px] bg-[#FCFCFD] shadow-[inset_1px_-1px_20px_0px_#DFE5EF] text-[#344977] text-[20px] rounded-[8px]">
                    学用结合案例
                </button>
                <!-- 按钮5 -->
                <button class="w-[420px] h-[80px] bg-[#FCFCFD] shadow-[inset_1px_-1px_20px_0px_#DFE5EF] text-[#344977] text-[20px] rounded-[8px]">
                    重点推荐
                </button>
                <!-- 按钮6 -->
                <button class="w-[420px] h-[80px] bg-[#FCFCFD] shadow-[inset_1px_-1px_20px_0px_#DFE5EF] text-[#344977] text-[20px] rounded-[8px]">
                    “举榜挂帅”项目
                </button>
                <!-- 按钮7 -->
                <button class="w-[420px] h-[80px] bg-[#FCFCFD] shadow-[inset_1px_-1px_20px_0px_#DFE5EF] text-[#344977] text-[20px] rounded-[8px]">
                    课程教材
                </button>
                <!-- 按钮8 -->
                <button class="w-[420px] h-[80px] bg-[#FCFCFD] shadow-[inset_1px_-1px_20px_0px_#DFE5EF] text-[#344977] text-[20px] rounded-[8px]">
                    工作建议
                </button>
            </div>
        </div>

    </div>
</body>
</html>

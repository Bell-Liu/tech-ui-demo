                    学用结合案例
                </button>

                <button onclick="switchPage('重点推荐', this)" class="nav-btn w-[420px] h-[80px] bg-[#FCFCFD] shadow-[inset_1px_-1px_20px_0px_#DFE5EF] text-[#344977] rounded-[8px] font-bold tracking-wider flex items-center justify-center text-[22px] hover:text-[#2B6EF5] transition-colors">

                </button>

    <!-- 原生 JavaScript 实现页面切换逻辑 -->
    <script>
        // 保存初始的“对照表总览”HTML内容，以便切换回来
        const overviewHTML = document.getElementById('page-overview').outerHTML;
        
        function switchPage(pageName, clickedButton) {
            // 1. 处理按钮高亮状态
            const allButtons = document.querySelectorAll('.nav-btn');
            allButtons.forEach(btn => {
                // 移除所有按钮的高亮状态
                btn.classList.remove('text-[#2B6EF5]', 'bg-[#F0F5FF]');
                btn.classList.add('text-[#344977]', 'bg-[#FCFCFD]');
            });
            
            // 给当前点击的按钮添加高亮状态
            if(clickedButton) {
                clickedButton.classList.remove('text-[#344977]', 'bg-[#FCFCFD]');
                clickedButton.classList.add('text-[#2B6EF5]', 'bg-[#F0F5FF]');
            }

            // 2. 处理内容区淡出动画
            const displayArea = document.getElementById('content-display-area');
            displayArea.style.opacity = '0';

            // 等待淡出动画完成后（300ms）再替换内容并淡入
            setTimeout(() => {
                if (pageName === '对照表总览') {
                    // 如果点击的是首页，恢复最初的 HTML 结构
                    displayArea.innerHTML = overviewHTML;
                } else {
                    // 如果点击的是其他页面，生成一个高度统一的占位面板
                    displayArea.innerHTML = `
                        <div class="w-[1800px] h-[701px] bg-[#FFFFFF] rounded-[8px] shadow-[2px_4px_20px_0px_rgba(68,73,85,0.12)] p-[30px] flex flex-col items-center justify-center relative overflow-hidden">
                            <!-- 装饰性背景光晕 -->
                            <div class="absolute top-[-100px] left-[-100px] w-[400px] h-[400px] bg-blue-50 rounded-full filter blur-[100px] opacity-60"></div>
                            <div class="absolute bottom-[-100px] right-[-100px] w-[400px] h-[400px] bg-indigo-50 rounded-full filter blur-[100px] opacity-60"></div>
                            
                            <!-- 居中标题与动效占位 -->
                            <div class="relative z-10 flex flex-col items-center animate-pulse">
                                <div class="w-[120px] h-[120px] bg-gradient-to-br from-[#E8F0FE] to-[#F0F5FF] rounded-full mb-8 flex items-center justify-center shadow-inner">
                                    <svg class="w-12 h-12 text-[#2B6EF5] opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                                    </svg>
                                </div>
                                <h2 class="text-[#344977] font-bold text-[36px] tracking-widest font-pangmen">${pageName}</h2>
                                <p class="text-gray-400 text-[18px] mt-4 tracking-wide">该页面的专属切图和数据组件即将在这里加载...</p>
                                
                                <!-- 提供一个返回按钮，方便用户切回主页 -->
                                <button onclick="switchPage('对照表总览', document.querySelectorAll('.nav-btn')[0])" class="mt-12 bg-[#2D70EB] hover:bg-[#1e58c8] text-white px-8 py-3 rounded-full font-bold tracking-wider transition-colors shadow-md flex items-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                                    返回全景图
                                </button>
                            </div>
                        </div>
                    `;
                }
                
                // 执行淡入动画
                displayArea.style.opacity = '1';
                
            }, 300); // 300毫秒对应 transition-duration
        }

        // 页面加载完成后，默认让第一个“对照表总览”按钮处于高亮选中状态
        window.onload = function() {
            const firstBtn = document.querySelectorAll('.nav-btn')[0];
            if(firstBtn) {
                firstBtn.classList.add('text-[#2B6EF5]', 'bg-[#F0F5FF]');
            }
        }
    </script>
</body>
</html>
